<!doctype html>
<html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRD-HR Management V8.0</title><link rel="stylesheet" href="css/glass.css">
<style>.hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hd h2{margin:0;font-size:1.05rem}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tabs button{border:0;border-radius:10px;padding:6px 12px;font:inherit;font-size:.82rem;cursor:pointer;background:var(--gl);color:var(--tx)}.tabs .on{background:var(--ac);color:#fff}
dl.f{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:6px 12px;margin:0}dl.f dt{color:var(--mu);font-size:.8rem}dl.f dd{margin:0;overflow-wrap:anywhere}
.fm{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.fm label{font-size:.78rem;color:var(--mu);display:grid;gap:2px}.fm input,.fm select{padding:7px;border-radius:8px;border:1px solid var(--bd);background:var(--gl);color:var(--tx);font:inherit}
.btn.alt{background:var(--ac)}.btn.er{background:var(--er)}.pg{display:flex;gap:8px;align-items:center;margin-top:10px}.msg{margin:8px 0}tr[data-id]{cursor:pointer}.arch{opacity:.55}</style></head>
<body><div class="app"><aside class="glass side"><div class="brand"><div class="logo">💧</div><div><b>PRD-HR</b><small>PSMD-Digital · V8.0</small></div></div>
<nav class="nav" id="nav"></nav><div class="demo">ទិន្នន័យ Demo/សិប្បនិម្មិត · Security ជា Demo ក្នុង Browser ប៉ុណ្ណោះ</div></aside>
<main><div class="top"><div><h1 id="ttl"></h1><div class="sub" id="crumb"></div></div><div class="glass user">👤 <select id="role"></select></div></div><section id="v"></section></main></div>
<dialog id="dg"><div id="dc"></div><button class="x" onclick="dg.close()">បិទ</button></dialog>
<script src="js/core/core.js"></script><script src="js/data/schema.js"></script><script src="js/data/providers.js"></script><script src="js/services/core-services.js"></script><script src="js/services/import-service.js"></script><script src="js/services/seed-service.js"></script><script src="js/services/hr-workflows.js"></script><script src="js/legacy-adapter.js"></script>
<script src="js/ui/app.js"></script><script src="js/ui/org-attendance.js"></script><script src="js/ui/leave-career.js"></script></body></html>
